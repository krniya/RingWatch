spring:
  datasource:
    url: jdbc:h2:mem:ringwatch_fraudring;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: fraud-ring-detection-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ringwatch.common.event
        spring.json.value.default.type: com.ringwatch.common.event.EnrichedTransactionEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

ringwatch:
  jwt:
    secret: test-only-secret-key-at-least-32-bytes-long-for-hs256
  fraud-ring:
    min-cluster-size: 3
  ai:
    api-key: test-key-not-real
    base-url: http://localhost:1
    model: test-model
    timeout-seconds: 3

resilience4j:
  circuitbreaker:
    instances:
      ringExplainer:
        sliding-window-type: count_based
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      ringExplainer:
        max-attempts: 2
        wait-duration: 10ms
