server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: decision-engine-override
          uri: http://localhost:8085
          predicates:
            - Path=/transactions/*/override
            - Method=POST
        - id: ingestion-service
          uri: http://localhost:8082
          predicates:
            - Path=/transactions/**
        - id: audit-service
          uri: http://localhost:8087
          predicates:
            - Path=/audit/**
        - id: fraud-ring-detection-service
          uri: http://localhost:8086
          predicates:
            - Path=/fraud-rings/**
        - id: dashboard-gateway-service
          uri: ws://localhost:8091
          predicates:
            - Path=/ws/alerts
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,throttledAccounts
      # Actuator endpoints aren't reached through a Gateway Route (see ThrottledAccountsEndpoint's
      # Javadoc), so spring.cloud.gateway.globalcors above - which only answers CORS preflights for
      # matched routes - never covers them. Actuator's own dedicated CORS properties are the
      # documented mechanism for this exact gap.
      cors:
        allowed-origins: http://localhost:5173
        allowed-methods: GET
        allowed-headers: Authorization,Content-Type
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

ringwatch:
  jwt:
    secret: ${JWT_SECRET}
  rate-limit:
    limit: 20
    window: 10s
    top-throttled-size: 10
