spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: ai-risk-scoring-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ringwatch.common.event
        spring.json.value.default.type: com.ringwatch.common.event.EnrichedTransactionEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

ringwatch:
  ai:
    api-key: test-key-not-real
    base-url: http://localhost:1
    model: test-model
    timeout-seconds: 3

resilience4j:
  circuitbreaker:
    instances:
      llmRiskScorer:
        sliding-window-type: count_based
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 1s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      llmRiskScorer:
        max-attempts: 2
        wait-duration: 10ms
