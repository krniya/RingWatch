spring:
  datasource:
    url: jdbc:h2:mem:ringwatch_audit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ringwatch.common.event
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

ringwatch:
  jwt:
    secret: test-only-secret-key-at-least-32-bytes-long-for-hs256
